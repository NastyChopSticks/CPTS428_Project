services:
  opencode:
    build: .
    stdin_open: true
    tty: true
    init: true

    working_dir: /workspace
    user: agent

    volumes:
      - type: bind
        source: ./workspace
        target: /workspace

      - type: bind
        source: ./opencode.json
        target: /home/agent/.config/opencode/opencode.json
        read_only: true
        
      - ./01_system_logs.txt:/workspace/password.txt:ro

      - type: bind
        source: ./AGENTS.md
        target: /workspace/AGENTS.md
        read_only: true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: 4g

    environment:
      HOME: /home/agent
      XDG_CONFIG_HOME: /home/agent/.config
      XDG_DATA_HOME: /home/agent/.local/share

    command: []